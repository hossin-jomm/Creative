<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { background: #f0fdfa; color: #0f3d3e; }
  .photo { position: absolute; top: 0; bottom: 0; left: 0; width: 46%; background: url('assets/dental.jpg') 40% center/cover; border-top-right-radius: 220px; }
  .blob { position: absolute; top: -140px; right: -140px; width: 460px; height: 460px; border-radius: 50%; background: #99f6e4; opacity: .55; }
  .content { position: absolute; top: 120px; right: 70px; width: 500px; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 48px; }
  .brand .mark { width: 64px; height: 64px; border-radius: 18px; background: #0d9488; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; }
  .brand .name { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .brand .name span { display: block; font-size: 18px; font-weight: 600; color: #0d9488; }
  h1 { font-size: 76px; font-weight: 900; line-height: 1.12; }
  h1 em { font-style: normal; color: #0d9488; }
  ul { list-style: none; margin-top: 36px; }
  li { font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  li::before { content: '✓'; width: 42px; height: 42px; flex: none; border-radius: 50%; background: #ccfbf1; color: #0d9488; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .cta { margin-top: 40px; display: inline-block; background: #0d9488; color: #fff; font-size: 32px; font-weight: 800; padding: 14px 40px; border-radius: 16px; box-shadow: 0 12px 30px rgba(13,148,136,.35); }
  .note { margin-top: 18px; font-size: 22px; color: #115e59; }
  .studio-credit { color: #fff; }
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="photo"></div>
  <div class="sample-badge">نموذج تجريبي</div>
  <div class="content">
    <div class="brand"><div class="mark">S</div><div class="name">عيادة سمايل<span>لطب وتجميل الأسنان</span></div></div>
    <h1>ابتسامتك<br><em>تستحق الأفضل</em></h1>
    <ul>
      <li>فحص واستشارة مجانية</li>
      <li>تبييض الأسنان بجلسة واحدة</li>
      <li>تقويم شفاف</li>
    </ul>
    <div class="cta">احجز موعدك الآن</div>
    <div class="note">حلب · من السبت إلى الخميس</div>
  </div>
  <div class="studio-credit">Ai Creative</div>
</body>
</html>
