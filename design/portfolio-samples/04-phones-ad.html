<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { background: radial-gradient(circle at 25% 35%, #1d4ed8 0%, #172554 45%, #020617 100%); color: #fff; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(148,163,184,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.08) 1px, transparent 1px); background-size: 60px 60px; }
  .glow { position: absolute; left: 90px; top: 250px; width: 440px; height: 440px; border-radius: 50%; background: #38bdf8; filter: blur(120px); opacity: .45; }
  .card { position: absolute; left: 80px; top: 200px; width: 430px; height: 560px; border-radius: 40px; background: url('assets/phone.jpg') 30% center/cover; transform: rotate(-7deg); box-shadow: 0 40px 80px rgba(0,0,0,.55); border: 6px solid rgba(255,255,255,.12); }
  .content { position: absolute; top: 120px; right: 70px; width: 470px; z-index: 5; }
  .brand { font-size: 28px; font-weight: 800; color: #7dd3fc; margin-bottom: 60px; direction: ltr; text-align: right; }
  .brand span { color: #fff; }
  h1 { font-size: 80px; font-weight: 900; line-height: 1.1; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #38bdf8, #a78bfa); -webkit-background-clip: text; color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .chips div { font-size: 24px; font-weight: 700; padding: 8px 20px; border-radius: 999px; background: rgba(56,189,248,.14); border: 1px solid rgba(125,211,252,.45); }
  .cta { position: absolute; right: 70px; bottom: 120px; z-index: 5; background: #38bdf8; color: #082f49; font-size: 32px; font-weight: 900; padding: 14px 40px; border-radius: 16px; }
  .address { position: absolute; right: 70px; bottom: 64px; z-index: 5; font-size: 22px; color: #bae6fd; }
  .studio-credit { color: #e0f2fe; }
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div><div class="card"></div>
  <div class="sample-badge">نموذج تجريبي</div>
  <div class="content">
    <div class="brand"><span>TECH</span> ZONE</div>
    <h1>جهازك الجديد<br><em>بكفالة سنة كاملة</em></h1>
    <div class="chips"><div>أجهزة أصلية</div><div>توصيل داخل حلب</div><div>صيانة وبرمجة</div></div>
  </div>
  <div class="cta">راسلنا لمعرفة الأسعار</div>
  <div class="address">تك زون للموبايلات · حلب</div>
  <div class="studio-credit">Ai Creative</div>
</body>
</html>
