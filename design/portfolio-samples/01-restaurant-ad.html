<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { background: #1a0f0a; color: #fff; }
  .photo { position: absolute; inset: 0; background: url('assets/food.jpg') center/cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(26,15,10,0.15) 0%, rgba(26,15,10,0.25) 38%, rgba(26,15,10,0.92) 66%, #1a0f0a 100%); }
  .brand { position: absolute; top: 36px; right: 40px; z-index: 5; text-align: center; }
  .brand .mark { width: 96px; height: 96px; border-radius: 50%; background: #c2410c; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 900; border: 4px solid #fde68a; margin: 0 auto 8px; }
  .brand .name { font-size: 26px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .tag { position: absolute; top: 300px; left: 70px; z-index: 5; width: 210px; height: 210px; border-radius: 50%; background: #facc15; color: #7c2d12; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-12deg); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  .tag .big { font-size: 84px; font-weight: 900; line-height: 1; }
  .tag .small { font-size: 26px; font-weight: 700; }
  .content { position: absolute; right: 64px; left: 64px; bottom: 150px; z-index: 5; }
  .kicker { display: inline-block; background: #c2410c; font-size: 28px; font-weight: 700; padding: 4px 22px; border-radius: 8px; margin-bottom: 14px; }
  h1 { font-size: 104px; font-weight: 900; line-height: 1.05; color: #fde68a; }
  .desc { font-size: 34px; font-weight: 600; margin-top: 14px; color: #fff7ed; }
  .cta { position: absolute; right: 64px; left: 64px; bottom: 56px; z-index: 5; display: flex; align-items: center; justify-content: space-between; }
  .btn { background: #22c55e; color: #fff; font-size: 32px; font-weight: 800; padding: 12px 34px; border-radius: 999px; }
  .meta { font-size: 24px; color: #fed7aa; text-align: left; }
</style>
</head>
<body>
  <div class="photo"></div><div class="shade"></div>
  <div class="sample-badge">نموذج تجريبي</div>
  <div class="brand"><div class="mark">ب</div><div class="name">مطعم بيت الجدّة</div></div>
  <div class="tag"><div class="big">20%</div><div class="small">خصم</div></div>
  <div class="content">
    <div class="kicker">كل يوم جمعة</div>
    <h1>العرض العائلي</h1>
    <div class="desc">وجبة لـ4 أشخاص: مشاوي مشكّلة + مقبلات + مشروبات</div>
  </div>
  <div class="cta">
    <div class="btn"><svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.4 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg> احجز طاولتك</div>
    <div class="meta">حلب · توصيل للمنازل</div>
  </div>
  <div class="studio-credit">Ai Creative</div>
</body>
</html>
