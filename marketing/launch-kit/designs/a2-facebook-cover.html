<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="render-size" content="1640x624">
<link rel="stylesheet" href="brand.css">
<style>
  /* المحتوى المهم داخل المنتصف (نحو 1100px) لأن الجوال يقص الأطراف */
  body { width: 1640px; height: 624px; }
  .lines { position: absolute; inset: 0; background-image: repeating-linear-gradient(115deg, rgba(60,197,211,.06) 0 2px, transparent 2px 46px); }
  .glow { position: absolute; left: 520px; top: -200px; width: 600px; height: 600px; border-radius: 50%; background: var(--cyan); filter: blur(160px); opacity: .35; }
  .center { position: absolute; top: 0; bottom: 0; left: 270px; right: 270px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .logo { height: 92px; margin-bottom: 26px; }
  h1 { font-size: 66px; font-weight: 900; line-height: 1.15; }
  .sub { font-size: 30px; font-weight: 600; margin-top: 14px; color: #cfeff3; }
  .chips { display: flex; gap: 14px; margin-top: 26px; }
  .chips div { font-size: 24px; font-weight: 700; padding: 6px 22px; border-radius: 999px; border: 1px solid rgba(60,197,211,.6); background: rgba(60,197,211,.12); }
</style></head>
<body class="bg-dark">
  <div class="lines"></div><div class="glow"></div>
  <div class="center">
    <img class="logo" src="../assets/logo-white.png" alt="">
    <h1>نجيب لمحلك <span class="hl">زبائن</span>… مو بس لايكات</h1>
    <div class="sub">إعلانات فيسبوك وإنستغرام · إدارة المحتوى · تدريب</div>
    <div class="chips"><div>حلب</div><div dir="ltr">+963 994 661 991</div></div>
  </div>
</body></html>
